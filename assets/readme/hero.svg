  </g>
  <g id="autonomous-puppet" transform="translate(974 58)">
    <rect x="0" y="0" width="170" height="224" rx="20" fill="#171a23" stroke="#46d6c8" stroke-width="4"/>
    <circle cx="85" cy="69" r="35" fill="#292645" stroke="#8e82ff" stroke-width="4"/>
    <circle cx="73" cy="66" r="4" fill="#48d9ff"/><circle cx="97" cy="66" r="4" fill="#48d9ff"/>
    <path d="M74 84q11 10 22 0M85 104v55M85 122 47 148M85 122l38 26M85 159l-28 42M85 159l28 42" fill="none" stroke="#b7afff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
